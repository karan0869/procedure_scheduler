# =========================================================
# APPLICATION
# =========================================================

spring.application.name=prowatch-scheduler-v2

server.port=8089
server.servlet.context-path=/pro_watch/api/v2


# =========================================================
# DATASOURCE
# =========================================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://##DB_IP##:##DB_PORT##/##DB_NAME##
spring.datasource.username=##DB_USER##
spring.datasource.password=##DB_PASS##

# Local Example
# spring.datasource.url=jdbc:postgresql://localhost:5432/prowatch_v2_dev
# spring.datasource.username=postgres
# spring.datasource.password=postgres


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.pool-name=ProWatch-HikariPool


# =========================================================
# QUARTZ CONFIGURATION
# =========================================================

spring.quartz.job-store-type=jdbc

# Automatically creates Quartz tables
spring.quartz.jdbc.initialize-schema=always

# Quartz Scheduler
spring.quartz.properties.org.quartz.scheduler.instanceName=QUARTZ_DB_SCHEDULER
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# Thread Pool
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# JDBC Job Store
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000


# =========================================================
# LIQUIBASE
# =========================================================

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=false
spring.liquibase.contexts=default
spring.liquibase.default-schema=public
spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
spring.liquibase.database-change-log-table=DATABASECHANGELOG


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.web.config=DEBUG
logging.level.org.springframework.messaging=DEBUG


# =========================================================
# SWAGGER / OPENAPI
# =========================================================

springdoc.swagger-ui.path=/swagger-ui.html
swagger.file.path=classpath:swagger.properties


# =========================================================
# ACTUATOR / MONITORING
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,beans,loggers,threaddump,heapdump
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}