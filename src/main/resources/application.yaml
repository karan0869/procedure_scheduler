spring:
  application:
    name: proWatch-scheduler
  datasource:
    url: jdbc:postgresql://10.111.1.34:5432/pro_watch_v5_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  quartz:
    job-store-type: jdbc

    jdbc:
      initialize-schema: always

    properties:
      org:
        quartz:

          scheduler:
            instanceName: QUARTZ_DB_SCHEDULER
            instanceId: AUTO

          threadPool:
            threadCount: 5

          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: QRTZ_
            isClustered: true
            clusterCheckinInterval: 20000